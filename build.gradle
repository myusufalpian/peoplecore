import java.security.MessageDigest
import java.util.HexFormat

plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'id.mydev'
version = '0.0.1-SNAPSHOT'

ext['tomcat.version'] = '11.0.26'
ext['jackson-bom.version'] = '3.1.7'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

def coverageMinimum = new BigDecimal('0.85')
def jacocoTestExecutionData = layout.buildDirectory.file('jacoco/test.exec')
def postgresExecutionData = layout.buildDirectory.file('jacoco/postgresIntegrationTest.exec')
def documentParserPdfBoxVersion = '3.0.8'

configurations {
	documentParserRuntime
}

sourceSets {
	documentParser {
		java.srcDir 'src/documentParser/java'
		compileClasspath = configurations.documentParserRuntime
		runtimeClasspath = output + configurations.documentParserRuntime
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-json'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation platform('software.amazon.awssdk:bom:2.42.33')
	implementation 'software.amazon.awssdk:s3'
	documentParserRuntime "org.apache.pdfbox:pdfbox:${documentParserPdfBoxVersion}"
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation "org.apache.pdfbox:pdfbox:${documentParserPdfBoxVersion}"
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('documentParserInventory') {
	inputs.files(configurations.documentParserRuntime)
	def inventory = layout.buildDirectory.file('document-parser-inventory.json')
	outputs.file(inventory)
	doLast {
		def entries = configurations.documentParserRuntime.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
			def coordinate = artifact.moduleVersion.id
			[ group: coordinate.group, name: artifact.name, version: coordinate.version, file: artifact.file.name,
			  sha256: HexFormat.of().formatHex(MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes)) ]
		}.sort { a, b -> "${a.group}:${a.name}:${a.version}" <=> "${b.group}:${b.name}:${b.version}" }
		inventory.get().asFile.text = groovy.json.JsonOutput.toJson([components: entries])
	}
}

tasks.register('documentParserRuntimeFiles', Sync) {
	dependsOn tasks.named('documentParserJar')
	into layout.buildDirectory.dir('document-parser-runtime')
	from(tasks.named('documentParserJar').flatMap { it.archiveFile }) { rename { 'document-parser.jar' } }
	from(configurations.documentParserRuntime) { into 'lib' }
	from(layout.buildDirectory.file('document-parser-inventory.json')) { rename { 'inventory.json' } }
}

tasks.register('documentParserJar', Jar) {
	dependsOn tasks.named('documentParserClasses')
	dependsOn tasks.named('documentParserInventory')
	archiveClassifier = 'document-parser'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	manifest { attributes 'Main-Class': 'id.mydev.peoplecore.document.parser.DocumentParser' }
	from sourceSets.documentParser.output
	from { configurations.documentParserRuntime.collect { it.isDirectory() ? it : zipTree(it) } }
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.named('bootJar') {
	dependsOn tasks.named('documentParserRuntimeFiles')
	from(tasks.named('documentParserJar').flatMap { it.archiveFile }) {
		into 'BOOT-INF/classes/document-parser'
		rename { 'document-parser.jar' }
	}
	from(layout.buildDirectory.file('document-parser-inventory.json')) {
		into 'BOOT-INF/classes/document-parser'
		rename { 'inventory.json' }
	}
}

tasks.named('test') {
	dependsOn tasks.named('documentParserJar')
	systemProperty 'peoplecore.document.parser.test-jar', tasks.named('documentParserJar').flatMap { it.archiveFile }.get().asFile.absolutePath
	useJUnitPlatform { excludeTags 'postgres' }
	inputs.property('localR2S3Endpoint', providers.environmentVariable('PEOPLECORE_R2_LOCAL_S3_ENDPOINT').orElse(''))
	finalizedBy tasks.named('jacocoTestReport')
	jacoco {
		destinationFile = jacocoTestExecutionData.get().asFile
	}
}

jacoco {
	toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
	mustRunAfter tasks.named('test')
	mustRunAfter 'postgresIntegrationTest'
	executionData(jacocoTestExecutionData, postgresExecutionData)
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.register('postgresIntegrationTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postgres' }
    shouldRunAfter tasks.named('test')
    jacoco { destinationFile = postgresExecutionData.get().asFile }
    inputs.property('postgresUrl', providers.environmentVariable('PEOPLECORE_TEST_DB_URL').orElse('jdbc:postgresql://localhost:54339/peoplecore_tests'))
}

tasks.register('migrate', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'id.mydev.peoplecore.infrastructure.migration.MigrationRunner'
}

tasks.register('verifyJacocoExecutionData') {
	dependsOn tasks.named('test'), tasks.named('postgresIntegrationTest')
	doLast {
		[jacocoTestExecutionData, postgresExecutionData].each { data ->
			File executionData = data.get().asFile
			if (!executionData.isFile() || executionData.length() == 0) {
				throw new GradleException('Expected JaCoCo execution data is missing or empty: ' + executionData.name)
			}
		}
	}
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('verifyJacocoExecutionData')
	executionData(jacocoTestExecutionData, postgresExecutionData)
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = coverageMinimum
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = coverageMinimum
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}
