plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'id.mydev'
version = '0.0.1-SNAPSHOT'

ext['tomcat.version'] = '11.0.26'
ext['jackson-bom.version'] = '3.1.7'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

def coverageMinimum = new BigDecimal('0.85')
def jacocoTestExecutionData = layout.buildDirectory.file('jacoco/test.exec')
def postgresExecutionData = layout.buildDirectory.file('jacoco/postgresIntegrationTest.exec')

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-json'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation platform('software.amazon.awssdk:bom:2.42.33')
	implementation 'software.amazon.awssdk:s3'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform { excludeTags 'postgres' }
	inputs.property('localR2S3Endpoint', providers.environmentVariable('PEOPLECORE_R2_LOCAL_S3_ENDPOINT').orElse(''))
	finalizedBy tasks.named('jacocoTestReport')
	jacoco {
		destinationFile = jacocoTestExecutionData.get().asFile
	}
}

jacoco {
	toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
	mustRunAfter tasks.named('test')
	mustRunAfter 'postgresIntegrationTest'
	executionData(jacocoTestExecutionData, postgresExecutionData)
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.register('postgresIntegrationTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postgres' }
    shouldRunAfter tasks.named('test')
    jacoco { destinationFile = postgresExecutionData.get().asFile }
    inputs.property('postgresUrl', providers.environmentVariable('PEOPLECORE_TEST_DB_URL').orElse('jdbc:postgresql://localhost:54339/peoplecore_tests'))
}

tasks.register('migrate', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'id.mydev.peoplecore.infrastructure.migration.MigrationRunner'
}

tasks.register('verifyJacocoExecutionData') {
	dependsOn tasks.named('test'), tasks.named('postgresIntegrationTest')
	doLast {
		[jacocoTestExecutionData, postgresExecutionData].each { data ->
			File executionData = data.get().asFile
			if (!executionData.isFile() || executionData.length() == 0) {
				throw new GradleException('Expected JaCoCo execution data is missing or empty: ' + executionData.name)
			}
		}
	}
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('verifyJacocoExecutionData')
	executionData(jacocoTestExecutionData, postgresExecutionData)
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = coverageMinimum
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = coverageMinimum
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}
