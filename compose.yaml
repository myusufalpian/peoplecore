services:
  postgres:
    image: peoplecore-postgres:18-local
    build: ./local/postgres
    environment:
      POSTGRES_DB: peoplecore
      POSTGRES_USER: peoplecore
      POSTGRES_PASSWORD: ${PEOPLECORE_DB_PASSWORD:?Set PEOPLECORE_DB_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - peoplecore-postgres:/var/lib/postgresql

  postgres-runtime-provision:
    image: peoplecore-postgres:18-local
    build: ./local/postgres
    profiles: ["provision"]
    environment:
      PGHOST: postgres
      PGDATABASE: peoplecore
      PGUSER: peoplecore
      PGPASSWORD: ${PEOPLECORE_DB_PASSWORD:?Set PEOPLECORE_DB_PASSWORD in .env.local}
      PEOPLECORE_RUNTIME_DB_PASSWORD: ${PEOPLECORE_RUNTIME_DB_PASSWORD:?Set PEOPLECORE_RUNTIME_DB_PASSWORD in .env.local}
    volumes:
      - ./local/postgres/provision-runtime.sql:/provision-runtime.sql:ro
    entrypoint: ["psql", "-X", "-f", "/provision-runtime.sql"]

  sqs:
    image: peoplecore-sqs:1.7.1-local
    build:
      context: .
      dockerfile: local/sqs/Dockerfile
    ports:
      - "127.0.0.1:4566:9324"
    volumes:
      - ./local/sqs/elasticmq.conf:/opt/elasticmq.conf:ro

  keycloak:
    image: peoplecore-keycloak:26.8.0-local
    build: ./local/keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env.local}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro

volumes:
  peoplecore-postgres:
