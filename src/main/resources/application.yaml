spring:
  application:
    name: peoplecore
  jpa:
    open-in-view: false
  flyway:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

logging:
  level:
    org.hibernate.orm.jdbc.error: 'OFF'
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: 'OFF'
