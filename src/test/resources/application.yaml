spring:
  datasource:
    url: jdbc:h2:mem:peoplecore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 10000
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
