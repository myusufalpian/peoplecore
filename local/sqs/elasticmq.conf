include classpath("application.conf")
node-address {
  protocol = http
  host = "*"
  port = 4566
  context-path = ""
}
rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}
rest-stats.enabled = false
aws {
  region = "ap-southeast-1"
  accountId = "000000000000"
}
queues {
  peoplecore-notifications {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    messageRetentionPeriod = 14 days
    deadLettersQueue { name = "peoplecore-notifications-dlq", maxReceiveCount = 5 }
  }
  peoplecore-notifications-dlq { messageRetentionPeriod = 14 days }
  peoplecore-exports {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    messageRetentionPeriod = 14 days
    deadLettersQueue { name = "peoplecore-exports-dlq", maxReceiveCount = 5 }
  }
  peoplecore-exports-dlq { messageRetentionPeriod = 14 days }
  peoplecore-email-feedback {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    messageRetentionPeriod = 14 days
    deadLettersQueue { name = "peoplecore-email-feedback-dlq", maxReceiveCount = 5 }
  }
  peoplecore-email-feedback-dlq { messageRetentionPeriod = 14 days }
}
