include classpath("application.conf")
node-address {
  protocol = http
  host = "*"
  port = 4566
  context-path = ""
}
rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}
rest-stats.enabled = false
aws {
  region = "ap-southeast-1"
  accountId = "000000000000"
}
queues {
  peoplecore-notifications {}
  peoplecore-notifications-dlq {}
}
